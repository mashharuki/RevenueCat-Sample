name: memo_app
options:
  bundleIdPrefix: com.haruki
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  MemoApp:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: GoogleService-Info.plist
        buildPhase: resources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Kept here (not just hand-edited into Sources/Info.plist) so `xcodegen generate` stops
        # wiping these on every regeneration — see tasks.md Implementation Notes 2.1/2.2 for the
        # prior recurring pain point this caused.
        GIDClientID: "682928555697-ne4a7qcqrjp747b86a9j1d5od0lj93u1.apps.googleusercontent.com"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "com.googleusercontent.apps.682928555697-ne4a7qcqrjp747b86a9j1d5od0lj93u1"
  MemoAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/MemoAppTests
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MemoApp
schemes:
  MemoApp:
    build:
      targets:
        MemoApp: all
        MemoAppTests: [test]
    test:
      targets:
        - MemoAppTests
